<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Warning - Phishing Blocked</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --danger-color: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      background: var(--card-bg);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 16px;
      padding: 40px;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 25px 50px -12px rgba(239, 68, 68, 0.25);
      text-align: center;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 10px;
    }
    h1 {
      color: var(--danger-color);
      margin-top: 0;
      font-size: 28px;
    }
    p {
      color: var(--text-muted);
      line-height: 1.6;
      font-size: 16px;
    }
    .url-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      padding: 12px 16px;
      border-radius: 8px;
      word-break: break-all;
      font-family: monospace;
      color: #fca5a5;
      margin: 20px 0;
    }
    .reason-box {
      background: rgba(239, 68, 68, 0.1);
      border-left: 4px solid var(--danger-color);
      padding: 10px 15px;
      text-align: left;
      font-size: 14px;
      border-radius: 4px;
      margin-bottom: 25px;
    }
    .btn-group {
      display: flex;
      gap: 15px;
      justify-content: center;
    }
    button {
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background-color: var(--danger-color);
      color: white;
    }
    .btn-primary:hover {
      background-color: #dc2626;
    }
    .btn-secondary {
      background-color: #334155;
      color: var(--text-main);
    }
    .btn-secondary:hover {
      background-color: #475569;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🚨</div>
    <h1>Phishing Site Intercepted!</h1>
    <p>The Real-Time Phishing & Suspicious Link Detector blocked this website to protect your credentials and personal security.</p>
    
    <div class="url-box" id="target-url">Loading...</div>
    
    <div class="reason-box" id="reason-text">
      <strong>Detection Reason:</strong> <span id="reason-details">Suspicious link pattern detected.</span>
    </div>

    <div class="btn-group">
      <button class="btn-primary" id="close-btn">Close Safety Tab</button>
      <button class="btn-secondary" id="proceed-btn">Proceed Anyway (Unsafe)</button>
    </div>
  </div>

  <script src="warning.js"></script>
</body>
</html>
