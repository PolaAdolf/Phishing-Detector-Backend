<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phishing Detector</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --safe: #22c55e;
      --danger: #ef4444;
      --accent: #3b82f6;
    }
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .header h3 {
      margin: 0;
      font-size: 16px;
      color: #f1f5f9;
    }
    .url-card {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: var(--muted);
      word-break: break-all;
      margin-bottom: 14px;
    }
    .status-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .badge.SAFE {
      background-color: rgba(34, 197, 94, 0.15);
      color: var(--safe);
      border: 1px solid var(--safe);
    }
    .badge.DANGER {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    .badge.LOADING {
      background-color: rgba(59, 130, 246, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .score {
      font-size: 22px;
      font-weight: 800;
      margin: 6px 0;
    }
    .reason {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">🛡️</span>
    <h3>Phishing Detector</h3>
  </div>

  <div class="url-card" id="url-display">
    Detecting active tab...
  </div>

  <div class="status-card" id="status-card">
    <div class="badge LOADING" id="status-badge">ANALYZING</div>
    <div class="score" id="risk-score">-- %</div>
    <div class="reason" id="reason-text">Connecting to backend engine...</div>
  </div>

  <button id="scan-btn">Scan Current Page</button>

  <script src="popup.js"></script>
</body>
</html>
